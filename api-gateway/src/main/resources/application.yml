spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: payments
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/payments/**
        - id: auth
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: wallets
          uri: ${WALLET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/wallets/**
server:
  port: 8080
management:
  endpoints.web.exposure.include: health,info,metrics
