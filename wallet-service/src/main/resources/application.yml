spring:
  application:
    name: wallet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/wallets}
    username: ${DB_USERNAME:wallets}
    password: ${DB_PASSWORD:wallets}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 8082
management:
  endpoints.web.exposure.include: health,info,metrics
