services:
  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports: ["5432:5432"]
    volumes: ["payment-db-data:/var/lib/postgresql/data"]

  wallet-db:
    image: postgres:16
    environment:
      POSTGRES_DB: wallets
      POSTGRES_USER: wallets
      POSTGRES_PASSWORD: wallets
    ports: ["5433:5432"]
    volumes: ["wallet-db-data:/var/lib/postgresql/data"]

  kafka:
    image: bitnami/kafka:3.8
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

  payment-service:
    build: ./payment-service
    ports: ["8081:8081"]
    environment:
      DB_URL: jdbc:postgresql://payment-db:5432/payments
      DB_USERNAME: payments
      DB_PASSWORD: payments
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: change-this-development-secret-key-to-a-long-32-byte-value
    depends_on: [payment-db, kafka]

  wallet-service:
    build: ./wallet-service
    ports: ["8082:8082"]
    environment:
      DB_URL: jdbc:postgresql://wallet-db:5432/wallets
      DB_USERNAME: wallets
      DB_PASSWORD: wallets
    depends_on: [wallet-db]

  notification-service:
    build: ./notification-service
    ports: ["8083:8083"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on: [kafka]

volumes:
  payment-db-data:
  wallet-db-data:
